<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artesanías Gabi | Taller de Autor</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --vintage-gold: #c5a059; --dark-wood: #2c241e; --paper-bg: #f9f7f2; --text-color: #4a4a4a; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Lato', sans-serif; background-color: var(--paper-bg); color: var(--text-color); overflow-x: hidden; }
        header { padding: 60px 20px; text-align: center; background-color: #ffffff; border-bottom: 3px double var(--vintage-gold); }
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 8vw, 3.5rem); color: var(--dark-wood); margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        .subtitle { font-style: italic; color: var(--vintage-gold); font-size: 1.1rem; margin-top: 10px; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid-artesanias { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { background: white; padding: 15px; border: 1px solid #e0dcd0; transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; display: flex; flex-direction: column; will-change: transform; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-color: var(--vintage-gold); }
        .card img { width: 100%; height: 320px; object-fit: cover; background-color: #f0f0f0; display: block; }
        .card-info { text-align: center; padding: 15px 5px; }
        .card-info h3 { font-family: 'Playfair Display', serif; margin: 10px 0; color: var(--dark-wood); font-size: 0.95rem; }
        .price { color: var(--vintage-gold); font-weight: bold; font-size: 1.2rem; display: block; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
        .modal-content { margin: 5vh auto; border: 1px solid var(--vintage-gold); width: 90%; max-width: 450px; position: relative; border-radius: 4px; overflow: hidden; background-color: var(--dark-wood); }
        #modal-bg-img { width: 100%; height: 100%; position: absolute; background-size: cover; background-position: center; opacity: 0.4; z-index: 0; }
        .modal-overlay { padding: 60px 30px; position: relative; z-index: 1; min-height: 450px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: white; }
        .close { position: absolute; right: 15px; top: 5px; font-size: 40px; cursor: pointer; color: var(--vintage-gold); z-index: 10; border: none; background: none; }
        .btn-buy { text-decoration: none; background: var(--vintage-gold); color: white; padding: 15px 30px; display: inline-block; text-transform: uppercase; font-weight: bold; transition: 0.3s; border: none; cursor: pointer; }
        footer { background: var(--dark-wood); color: #888; text-align: center; padding: 30px 20px; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <h1>Artesanías Gabi</h1>
    <p class="subtitle">Legado en cada detalle, arte en cada pieza</p>
</header>

<main class="container">
    <div id="galeria" class="grid-artesanias"></div>
</main>

<div id="miModal" class="modal">
    <div class="modal-content">
        <div id="modal-bg-img"></div>
        <button class="close" onclick="cerrarDetalle()">&times;</button>
        <div class="modal-overlay">
            <h2 id="modal-titulo" style="font-family: 'Playfair Display', serif; font-size: 1.8rem; margin: 0;"></h2>
            <p id="modal-desc" style="font-style: italic; margin: 20px 0; line-height: 1.5;"></p>
            <h3 id="modal-precio" style="color: var(--vintage-gold); font-size: 1.8rem; margin-bottom: 30px;"></h3>
            <a id="btn-whatsapp" href="javascript:void(0);" class="btn-buy">Reclamar mi amuleto</a>
        </div>
    </div>
</div>

<footer>
    <p>&copy; 2026 Artesanías Gabi - Taller de Autor.</p>
</footer>

    { id: 102, titulo: "COLLAR FLOR 5 PUNTAS", precio: "$44.000", img: "COLLAR FLOR 5 PUNTAS.jpg", desc: "Cinco pétalos, cinco elementos. Un mapa de armonía para quien florece en medio de la tormenta." },

    { id: 107, titulo: "ARETE PERRO MALTÉS MIYUKI", precio: "$30.000", img: "ARETE PERRO MALTÉS MIYUKI.jpg", desc: "Lealtad tejida hilo a hilo. Un homenaje al amor incondicional que nos acompaña." },

    { id: 109, titulo: "ARETE HELADO MIYUKI", precio: "$28.000", img: "ARETE HELADO MIYUKI.jpg", desc: "Dulzura eterna que no se derrite. Para la niña interior que aún cree en la magia." },

    { id: 114, titulo: "ARETE DOS COLORES GRIS DORADO MOSTACILLA", precio: "$25.000", img: "ARETE DOS COLORES GRIS DORADO MOSTACILLA.jpg", desc: "Ceniza y oro. El renacimiento del fénix capturado en un diseño atemporal." },
    { id: 115, titulo: "MANILLA FLORES MOSTACILLA", precio: "$23.000", img: "MANILLA FLORES MOSTACILLA.jpg", desc: "Un jardín en tu muñeca. El recordatorio de que la belleza crece a tu ritmo." },
    { id: 116, titulo: "MANILLA MULTICOLOR MOSTACILLA", precio: "$47.000", img: "MANILLA MULTICOLOR MOSTACILLA.jpg", desc: "Todos los caminos de la vida unidos por un hilo. La diversidad es tu mayor tesoro." },

    { id: 121, titulo: "TOPOS FLORES PEQUEÑAS MOSTACILLA", precio: "$10.000", img: "TOPOS FLORES PEQUEÑAS MOSTACILLA.jpg", desc: "Pequeños detalles florales que aportan frescura y originalidad a tu estilo." },

    { id: 125, titulo: "MANILLAS HILO COREANO", precio: "$7.000", img: "MANILLAS HILO COREANO.jpg", desc: "Hilos que conectan destinos. La leyenda del hilo rojo, ahora en tu mano." },
    { id: 126, titulo: "MANILLAS CUARZO ENCAUCHETADAS", precio: "$10.000", img: "MANILLAS CUARZO ENCAUCHETADAS.jpg", desc: "Piedras que guardan la memoria del tiempo. Energía pura para tu día a día." }

function cargarGaleria() {
    const galeria = document.getElementById('galeria');
    galeria.innerHTML = "";
    productos.forEach(prod => {
        const tarjeta = document.createElement('div');
        tarjeta.className = 'card';
        tarjeta.onclick = () => abrirDetalle(prod);
        tarjeta.innerHTML = `
            <img src="${prod.img}" alt="${prod.titulo}" onerror="this.src='https://placeholder.com'">
            <div class="card-info">
                <span style="font-size: 0.75rem; color: #999; display:block; margin-bottom:5px;">REF: ${prod.id}</span>
                <h3>${prod.titulo}</h3>
                <span class="price">${prod.precio}</span>
            </div>
        `;
        galeria.appendChild(tarjeta);
    });
}

function abrirDetalle(prod) {
    productoActual = prod;
    document.getElementById('modal-titulo').innerText = prod.titulo;
    document.getElementById('modal-desc').innerText = prod.desc;
    document.getElementById('modal-precio').innerText = prod.precio;
    document.getElementById('modal-bg-img').style.backgroundImage = `url('${prod.img}')`;
    
    document.getElementById('btn-whatsapp').onclick = enviarAWhatsApp;
    document.getElementById('miModal').style.display = 'block';
}

function enviarAWhatsApp() {
    if (!productoActual) return;
    const mensajeWha = encodeURIComponent(`Hola Gabi, estoy interesado en el producto: ${productoActual.titulo} (REF: ${productoActual.id}) con valor de ${productoActual.precio}`);
    window.location.href = `https://wa.me{mensajeWha}`;
}

function cerrarDetalle() {
    document.getElementById('miModal').style.display = 'none';
}

window.onclick = function(event) {
    const modal = document.getElementById('miModal');
    if (event.target == modal) {
        modal.style.display = "none";
    }
}

window.onload = cargarGaleria;
</script>
</body>
</html>
